<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangalan Heat Index Calculator</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-color); 
        }
        .card { 
            background: var(--card-bg); 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 90%; 
            max-width: 380px; 
        }
        h2 { color: var(--text-main); text-align: center; margin-top: 0; font-weight: 700; }
        .input-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; font-weight: 600; color: #64748b; }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #3b82f6; }
        #result-box { 
            margin-top: 1.5rem; 
            padding: 1.5rem; 
            border-radius: 12px; 
            text-align: center; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: none; 
        }
        .hi-value { font-size: 3rem; font-weight: 800; display: block; line-height: 1; }
        .hi-label { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        .hi-desc { font-size: 0.9rem; line-height: 1.5; margin-top: 10px; opacity: 0.9; }
    </style>
</head>
<body>

<div class="card">
    <h2>Heat Index</h2>
    
    <div class="input-group">
        <label>Temperature (°C)</label>
        <input type="number" id="temp" placeholder="e.g. 34" oninput="calculate()">
    </div>
    
    <div class="input-group">
        <label>Relative Humidity (%)</label>
        <input type="number" id="rh" placeholder="e.g. 69" oninput="calculate()">
    </div>

    <div id="result-box">
        <span class="hi-label" id="hi-status"></span>
        <span class="hi-value" id="hi-display">0</span>
        <p class="hi-desc" id="hi-msg"></p>
    </div>
</div>

<script>
function calculate() {
    // BUG FIX: Explicitly cast to Number to avoid string concatenation
    const tc = Number(document.getElementById('temp').value);
    const rh = Number(document.getElementById('rh').value);
    const resultBox = document.getElementById('result-box');

    // Validation: Heat Index formula only works effectively above 26.7°C (80°F)
    if (!tc || !rh || tc < 20 || rh < 0 || rh > 100) {
        resultBox.style.display = 'none';
        return;
    }

    // Convert Celsius to Fahrenheit
    const tf = (tc * 9/5) + 32;
    
    // Initial simple calculation
    let hi = 0.5 * (tf + 61.0 + ((tf - 68.0) * 1.2) + (rh * 0.094));

    // Rothfuz Regression Equation (refined for accuracy)
    if (hi > 79) {
        hi = -42.379 + 2.04901523 * tf + 10.14333127 * rh 
             - 0.22475541 * tf * rh - 0.00683783 * tf * tf 
             - 0.05481717 * rh * rh + 0.0122874 * tf * tf * rh 
             + 0.0085282 * tf * rh * rh - 0.0000199 * tf * tf * rh * rh;

        // Adjustments for specific humidity/temp ranges
        if (rh < 13 && tf >= 80 && tf <= 112) {
            hi -= ((13 - rh) / 4) * Math.sqrt((17 - Math.abs(tf - 95)) / 17);
        } else if (rh > 85 && tf >= 80 && tf <= 87) {
            hi += ((rh - 85) / 10) * ((87 - tf) / 5);
        }
    }

    // Convert back to Celsius and round
    const hiCelsius = Math.round((hi - 32) * 5/9);
    displayResult(hiCelsius);
}

function displayResult(val) {
    const box = document.getElementById('result-box');
    const status = document.getElementById('hi-status');
    const display = document.getElementById('hi-display');
    const msg = document.getElementById('hi-msg');

    box.style.display = 'block';
    display.innerText = val + "°C";

    // Classification Logic
    if (val < 27) {
        setTheme(box, "#f1f5f9", "#475569", "Normal", "Conditions are safe. No special precautions needed.");
    } else if (val >= 27 && val <= 32) {
        setTheme(box, "#fef3c7", "#92400e", "Caution", "Fatigue possible with prolonged exposure and activity.");
    } else if (val >= 33 && val <= 40) {
        setTheme(box, "#ffedd5", "#c2410c", "Extreme Caution", "Heat cramps and heat exhaustion are possible.");
    } else if (val >= 41 && val <= 51) {
        setTheme(box, "#fee2e2", "#b91c1c", "Danger", "Heat exhaustion is likely. Limit outdoor activities.");
    } else {
        setTheme(box, "#450a0a", "#ffffff", "Extreme Danger", "Heatstroke is imminent. Seek immediate medical cooling.");
    }
}

function setTheme(el, bg, color, label, message) {
    el.style.backgroundColor = bg;
    el.style.color = color;
    document.getElementById('hi-status').innerText = label;
    document.getElementById('hi-msg').innerText = message;
}
</script>

</body>
</html>

<script>
function calculate() {
    const tc = parseFloat(document.getElementById('temp').value);
    const rh = parseFloat(document.getElementById('rh').value);
    const resultBox = document.getElementById('result-box');

    if (isNaN(tc) || isNaN(rh) || tc < 20) {
        resultBox.style.display = 'none';
        return;
    }

    // Convert to Fahrenheit for Rothfuz formula
    const tf = (tc * 9/5) + 32;
    
    // Simple HI check
    let hi = 0.5 * (tf + 61.0 + ((tf - 68.0) * 1.2) + (rh * 0.094));

    // Complex Rothfuz Regression (if HI > 80°F)
    if (hi > 80) {
        hi = -42.379 + 2.04901523*tf + 10.14333127*rh - 0.22475541*tf*rh 
             - 0.00683783*tf*tf - 0.05481717*rh*rh + 0.0122874*tf*tf*rh 
             + 0.0085282*tf*rh*rh - 0.0000199*tf*tf*rh*rh;
    }

    const hiCelsius = Math.round((hi - 32) * 5/9);
    displayResult(hiCelsius);
}

function displayResult(val) {
    const box = document.getElementById('result-box');
    const status = document.getElementById('hi-status');
    const display = document.getElementById('hi-display');
    const msg = document.getElementById('hi-msg');

    box.style.display = 'block';
    display.innerText = val + "°C";

    // Logic for classification (The "Fuzzy" Logic part)
    if (val < 27) {
        setTheme(box, "#e2e8f0", "#475569", "Normal", "Conditions are comfortable. Stay hydrated.");
    } else if (val >= 27 && val <= 32) {
        setTheme(box, "#fef3c7", "#92400e", "Caution", "Fatigue possible with prolonged exposure and activity.");
    } else if (val >= 33 && val <= 40) {
        setTheme(box, "#ffedd5", "#9a3412", "Extreme Caution", "Heat cramps and heat exhaustion are possible.");
    } else if (val >= 41 && val <= 53) {
        setTheme(box, "#fee2e2", "#991b1b", "Danger", "Heat exhaustion is likely. Limit outdoor activities.");
    } else {
        setTheme(box, "#450a0a", "#ffffff", "Extreme Danger", "Heatstroke is imminent. Seek shade and cool down immediately.");
    }
}

function setTheme(el, bg, color, label, message) {
    el.style.backgroundColor = bg;
    el.style.color = color;
    document.getElementById('hi-status').innerText = label;
    document.getElementById('hi-msg').innerText = message;
}
</script>

</body>
</html>
